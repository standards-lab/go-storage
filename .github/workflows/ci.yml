name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.1.1

      - name: mise run check
        run: mise run check

  # azureblob's and s3's acceptance tests run the conformance suite against the
  # compose harness's Azurite and SeaweedFS, through the task a developer runs.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.1.1

      - name: mise run acceptance
        run: mise run acceptance
