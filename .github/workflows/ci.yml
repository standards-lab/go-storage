name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.1.1

      - name: mise run check
        run: mise run check

  # azureblob's and s3's acceptance tests run the conformance suite against an
  # Azurite and a SeaweedFS container, which steps start because a service
  # container cannot take either's command-line flags. Each step names its
  # image on its own image: line, so mise run currency finds the pin.
  acceptance:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1

      - uses: jdx/mise-action@v5.1.1

      - name: start Azurite
        env:
          image: mcr.microsoft.com/azure-storage/azurite:3.37.0
        run: |
          docker run -d --name azurite -p 10000:10000 "$image" \
            azurite-blob --blobHost 0.0.0.0 --skipApiVersionCheck --loose
          for _ in $(seq 30); do
            curl -s -o /dev/null http://127.0.0.1:10000/ && exit 0
            sleep 1
          done
          docker logs azurite
          exit 1

      # This image: line is SeaweedFS's one pin: scripts/seaweedfs.sh takes it
      # as $image here and reads it from this file under mise run
      # seaweedfs:start, so the local harness runs the image CI runs.
      - name: start SeaweedFS
        env:
          image: chrislusf/seaweedfs:4.48
        run: scripts/seaweedfs.sh start

      - name: go test -race (azureblob)
        working-directory: azureblob
        env:
          AZUREBLOB_TEST_ENDPOINT: http://127.0.0.1:10000/devstoreaccount1
        run: go test -race ./...

      - name: go test -race (s3)
        working-directory: s3
        env:
          S3_TEST_ENDPOINT: http://127.0.0.1:8333
        run: go test -race ./...
