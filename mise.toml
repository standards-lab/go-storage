# See architecture/standards/go-elemental/principles/release-and-ci.md
[settings]
task.run_auto_install = false

[tools]
"github:standards-lab/claude-plugins" = { version = "0.22.0", version_prefix = "marathon/v" }
go = "1.27.4"
golangci-lint = "2.15.0"
jq = "1.8.2"
"aqua:google/go-containerregistry" = "0.22.1"

[env]
GO_MODULES = ". azureblob s3"

[tasks.check]
description = "Build, vet, format, fix, tidy, test, and lint every module, then run lint-context and lint-references; writes nothing"
run = '''
set -eu
export GOWORK=off
for mod in $GO_MODULES; do
  echo "check: $mod"
  cd "$MISE_PROJECT_ROOT/$mod"
  go build ./...
  go vet ./...
  unformatted=$(gofmt -l .)
  if [ -n "$unformatted" ]; then echo "gofmt: unformatted files:"; echo "$unformatted"; exit 1; fi
  go fix -diff ./...
  go mod tidy -diff
  go test -race ./...
  golangci-lint run ./...
done
cd "$MISE_PROJECT_ROOT"
fail=0
for lint in lint-context lint-references; do
  if ! command -v "$lint" >/dev/null; then
    echo "FAIL: $lint is not on PATH; run mise install" >&2
    fail=1
  elif ! "$lint"; then
    fail=1
  fi
done
exit "$fail"
'''

[tasks.up]
description = "Start every harness service and wait until each is healthy"
run = "docker compose up -d --wait --build"

[tasks.down]
description = "Stop the harness, discarding its data"
run = "docker compose down"

[tasks."acceptance:s3"]
description = "Start a fresh SeaweedFS, run the s3 module's tests with S3_TEST_ENDPOINT set so acceptance runs, and stop it whether they pass or fail, printing its log on failure"
env = { GOWORK = "off" }
run = '''
set -e
trap 'rc=$?; [ $rc -eq 0 ] || docker compose logs seaweedfs; docker compose down seaweedfs; exit $rc' EXIT
docker compose up -d --wait --build seaweedfs
(cd s3 && S3_TEST_ENDPOINT="http://127.0.0.1:${SEAWEEDFS_PORT:-8333}" go test -race -count=1 -v ./...)
'''

[tasks."acceptance:azureblob"]
description = "Start a fresh Azurite, run the azureblob module's tests with AZUREBLOB_TEST_ENDPOINT set so acceptance runs, and stop it whether they pass or fail, printing its log on failure"
env = { GOWORK = "off" }
run = '''
set -e
trap 'rc=$?; [ $rc -eq 0 ] || docker compose logs azurite; docker compose down azurite; exit $rc' EXIT
docker compose up -d --wait --build azurite
(cd azureblob && AZUREBLOB_TEST_ENDPOINT="http://127.0.0.1:${AZURITE_BLOB_PORT:-10000}/devstoreaccount1" go test -race -count=1 -v ./...)
'''

[tasks.acceptance]
description = "Run every provider's acceptance tests one provider at a time, each against a fresh harness service, running every provider even after one fails"
run = '''
rc=0
mise run acceptance:s3 || rc=1
mise run acceptance:azureblob || rc=1
exit $rc
'''

[tasks.currency]
description = "Report every requirement, Go version, tool, action pin, and image tag behind its latest; writes nothing"
run = "scripts/currency.sh"

[tasks.upgrade]
description = "Upgrade every module's go directive to the current Go minor, with no toolchain line, and its direct requirements and the local mise tools to their latest, rewriting go.mod and mise.toml"
run = '''
set -eu
export GOWORK=off
go_minor=$(mise latest go | cut -d. -f1,2)
for mod in $GO_MODULES; do
  cd "$MISE_PROJECT_ROOT/$mod"
  go mod edit -go="$go_minor" -toolchain=none
  direct=$(go mod edit -json | jq -r '.Require[]? | select(.Indirect | not) | .Path')
  [ -z "$direct" ] || go get $(printf '%s@latest ' $direct)
  go mod tidy
done
cd "$MISE_PROJECT_ROOT"
mise upgrade --bump --local
'''

[tasks.build]
description = "Build every module in GO_MODULES standalone with GOWORK=off, resolving its pins as a consumer does"
run = '''
set -e
for mod in $GO_MODULES; do
  echo "==> build: $mod"
  (cd "$mod" && GOWORK=off go build ./...)
done
'''

[tasks.test]
description = "Run tests across all modules"
run = '''
set -e
for mod in $GO_MODULES; do
  echo "==> test: $mod"
  (cd "$mod" && go test -race ./...)
done
'''

[tasks.vet]
description = "Run go vet across all modules"
run = '''
set -e
for mod in $GO_MODULES; do
  echo "==> vet: $mod"
  (cd "$mod" && go vet ./...)
done
'''

[tasks.fmt]
description = "Format all Go source"
run = "gofmt -w ."

[tasks.tidy]
description = "Run go mod tidy across all modules"
run = '''
set -e
for mod in $GO_MODULES; do
  echo "==> tidy: $mod"
  (cd "$mod" && go mod tidy)
done
'''

[tasks.lint]
description = "Run golangci-lint across all modules"
run = '''
set -e
for mod in $GO_MODULES; do
  echo "==> lint: $mod"
  (cd "$mod" && golangci-lint run ./...)
done
'''
